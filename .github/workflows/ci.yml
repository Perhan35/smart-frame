name: CI

# Kept minimal to save GitHub Actions minutes:
# - runs only when code or dependency files change
# - one small job, cancelled if a newer push arrives
on:
  push:
    branches: [main]
    paths: ['**.py', '**.sh', '**.hook', 'ruff.toml', 'requirements*.txt', 'tests/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['**.py', '**.sh', '**.hook', 'ruff.toml', 'requirements*.txt', 'tests/**', '.github/workflows/ci.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install tools  # shellcheck is preinstalled on ubuntu runners
        # Only what the tests need: pygame/pyaudio (PortAudio, SDL) are not installed,
        # the tests never import them (tests/conftest.py stubs pyaudio).
        run: |
          pip install --quiet \
            "$(grep '^ruff==' requirements-dev.txt)" \
            "$(grep '^pytest==' requirements-dev.txt)" \
            "$(grep '^pip-audit==' requirements-dev.txt)" \
            "$(grep '^numpy==' requirements.txt)" \
            "$(grep '^paho-mqtt==' requirements.txt)" \
            "$(grep '^PyYAML==' requirements.txt)"
      - name: Lint
        run: scripts/lint.sh
      - name: Tests
        run: python -m pytest -q
      - name: Known vulnerabilities in the dependencies
        # Pinned versions only (no install, nothing to build)
        run: pip-audit -r requirements.txt --no-deps --disable-pip
